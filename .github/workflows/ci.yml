name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 🔴 プラットフォーム分岐が4ファイルに閉じ込められているかの検査（設計レポート §10.4）
  # Mac 実機でデバッグできない体制のため、「Macで壊れうる範囲」を予測可能に保つのが前提条件。
  platform-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/platform-guard.mjs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 下書きの索引。壊れると「保存したのに一覧に出ない」という気づきにくい壊れ方をする
      - run: npm run test:drafts
      # 🔴 改行位置と表示時刻の重なり。どちらも画面上は普通に見えるので手では見つからない。
      #    重なりを放置すると、書き出した動画の後半でテロップが軒並みずれる。
      - run: npm run test:telop
      # 🔴 タイムラインの土台（素材・レーン・クリップ）。
      #    置く場所の計算がずれると、映像が1コマ抜ける・音がずれるといった
      #    **書き出すまで気づけない**壊れ方をする。
      - run: npm run test:timeline
      # 🔴 書き出した XML の中身の並び。違うと Final Cut は
      #    「DTD の検証でエラー」とだけ言って、丸ごと読み込みを断る。
      - run: npm run test:tlxml
      # 🔴 保存した書類は人が触れる場所にある。壊れたものを
      #    そのまま入れると、画面が真っ白になって原因が分からなくなる。
      - run: npm run test:tlsave
      # 🔴 素材の URL 作り。Windows のパスを URL と見なすと
      #    「今まで開けていた動画が開けない」になる（実際に出した）。
      - run: npm run test:asseturl
      # 元素材の時刻とカット後の時刻の変換。ここがずれると全部ずれる
      - run: npm run test:time

  # サイドカーが両OSで起動し、stdio JSON-RPC が成立するか
  sidecar:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 構文チェック
        run: python -m compileall -q sidecar
      # 🔴 区間が数百本のときにフィルタがコマンドラインに載らないこと。
      #    20分素材＋人物アップで上限を超えて書き出せなくなっていた。
      #    ffmpeg を動かさないので、どのOSでも即座に終わる。
      - name: 書き出しフィルタの長さ
        run: python scripts/test_export_graph.py
      # 🔴 確信度の3分割。「自動で見送り」が構造上ずっと空だったので数字で縛る
      - name: カット候補の確信度
        run: python scripts/test_cut_confidence.py
      # Final Cut へ渡すタイムライン。フレーム境界と file:// URL が要点
      - name: FCPXML の書き出し
        run: python scripts/test_fcpxml.py
      # 🔴 テロップの帯は1本しかない。重なりを並べると後半が芋づる式にずれる
      - name: テロップの帯と字幕
        run: python scripts/test_telop_track.py
      - name: stdio JSON-RPC の疎通（ping / env）
        shell: bash
        run: |
          printf '%s\n%s\n' \
            '{"id":1,"method":"ping","params":{"message":"ci"}}' \
            '{"id":2,"method":"env","params":{}}' \
            | python -m sidecar | tee /tmp/out.jsonl
          grep -q '"pong": *true' /tmp/out.jsonl
          grep -q '"platform"' /tmp/out.jsonl

  # Electron → Python サイドカー の疎通を実機OSで確認する。
  # macos-14 は arm64 なので、T5（Mac版ビルド）の早期シグナルにもなる。
  electron-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - run: npm run smoke
      - name: 結果を確認
        shell: bash
        run: |
          cat phase0-artifacts/smoke-result.json
          grep -q '"ok": *true' phase0-artifacts/smoke-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: phase0-artifacts/
          if-no-files-found: warn

  # ffmpeg の調達 → GPL 汚染の検証 → 1080x1920 の書き出し（Phase 0 T3）
  # CI の Windows ランナーには GPU が無いので、§13.6 の libopenh264 フォールバック経路も
  # ここで自動的に検証されることになる。
  ffmpeg-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: LGPL ビルドを取得して検証
        run: python scripts/fetch_ffmpeg.py
      - name: テスト素材を生成
        run: python scripts/make_test_media.py
      - name: 1080x1920 の書き出し
        run: python scripts/export_smoke.py
      # 🔴 ①カットの中核。両OSで「実際に作れて、ブラウザが再生できる形か」を見る。
      #    Mac では libopenh264 が無いために全滅していたが、
      #    プラットフォーム分岐が無いので guard では捕まらなかった。
      - name: レビュー用クリップ
        run: python scripts/test_review_clip.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ffmpeg-windows-verification
          path: phase0-artifacts/export-smoke.json
          if-no-files-found: warn

  # 🔴 T1: テロップ WYSIWYG の回帰検出（§16 T1）
  # Canvas で描いたテロップを PNG にして ffmpeg で overlay した結果が、
  # ブラウザ上の合成結果と一致し続けることを守る。
  # ここが崩れると「プレビューと書き出しが違う」というアプリの根幹が壊れる。
  t1-wysiwyg:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: ffmpeg を用意
        # private リポジトリの Release から取るため gh の認証が要る
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/fetch_ffmpeg.py
      - run: python scripts/fetch_fonts.py
      - run: python scripts/make_test_media.py
      # 🔴 Mac でも実際にレビュー用クリップが作れるかを、ここで初めて確かめる。
      #    このジョブは macos-14 も回るので、Mac 実機の代わりになる。
      - run: python scripts/test_review_clip.py
      - run: npm run build
      - run: npm run t1
      - name: T1 の結果を確認
        shell: bash
        run: |
          cat phase0-artifacts/t1/t1-result.json
          grep -q '"ok": *true' phase0-artifacts/t1/t1-result.json
      # T2: BudouX の文節改行。フォントとビルドが揃っているのでこのジョブで一緒に回す。
      - run: npm run t2
      - name: T2 の結果を確認
        shell: bash
        run: |
          python -c "import json;d=json.load(open('phase0-artifacts/t2/t2-result.json',encoding='utf-8'));print('forcedRatio',d['forcedRatio'],'naive',d['naive'])"
          grep -q '"ok": *true' phase0-artifacts/t2/t2-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-${{ matrix.os }}
          path: phase0-artifacts/t2/
          if-no-files-found: warn
      # T5: テロップの書き出し経路。レンダラで PNG を作ってディスクに落とすまでを通す。
      # ここを検証していなかったせいで、透明な画像を焼き込む／PNG 生成で例外、
      # という「エラーが一瞬出て戻るだけ」の不具合を実際に出した。
      - run: npm run t5
      - name: T5 の結果を確認
        shell: bash
        env:
          # 🔴 Windows の Python は、既定で cp1252 に書き出そうとする。
          #    日本語のテロップを表示しようとした所で UnicodeEncodeError になり、
          #    **その下の合否判定まで到達しない**。
          #    「表示に失敗しただけ」なのに、T5 が落ちているように見えていた
          #    （2026-08-27 時点で6回以上、この理由だけで赤いままだった）。
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import json;d=json.load(open('phase0-artifacts/t5/t5-result.json',encoding='utf-8'));print(json.dumps(d['cards'],ensure_ascii=False,indent=2))"
          grep -q '"ok": *true' phase0-artifacts/t5/t5-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t5-${{ matrix.os }}
          path: phase0-artifacts/t5/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # 両OSの成果物を見比べればフォントのラスタライズ差も分かる（§10.3）
          name: t1-${{ matrix.os }}
          path: phase0-artifacts/t1/
          if-no-files-found: warn

  # 🔴 Windows と macOS のテロップ描画を突き合わせる（§10.3）
  # 開発者は Mac を持っていないので、「Mac だけ見た目が違う」に気づく手段がこれしかない。
  # フォントメトリクス（サイズ・配置・改行位置）の一致を守り、
  # 輪郭のアンチエイリアス差は許す。
  t1-cross-platform:
    needs: t1-wysiwyg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: t1-windows-latest
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: t1-macos-14
          path: artifacts/macos
      - run: python scripts/compare_platform_render.py artifacts/windows artifacts/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-render-compare
          path: phase0-artifacts/platform-render-compare.json
          if-no-files-found: warn

  # 🔴 ライセンス上「最初から避けるもの」が混入していないかの検査（§13.1）
  # x264/x265 (GPL) と Ultralytics YOLO (AGPL) は収益化時に致命的になる。
  license-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 禁止依存が入っていないこと
        run: |
          set -e
          if grep -rniE '^\s*(ultralytics|yolov[0-9])' sidecar/requirements.txt; then
            echo "::error::Ultralytics YOLO は AGPL のため使用禁止です（§13.1）"; exit 1
          fi
          if [ -f package.json ] && grep -niE '"(ultralytics|x264|x265)"' package.json; then
            echo "::error::GPL/AGPL 汚染の恐れがある依存が package.json にあります（§13.1）"; exit 1
          fi
          echo "license-guard: OK"
