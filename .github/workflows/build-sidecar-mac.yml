name: build-sidecar-mac

# macOS arm64 で Python サイドカーを PyInstaller で固め、実際に動くか確かめる（Phase 0 T5）。
#
# 🔴 開発者は Mac を所持していないため、**この経路が唯一のビルド手段**。
#    ここが通らないとプロジェクトが成立しない（§16 T5）。
#
# 検証すること:
#   - arm64 で PyInstaller ビルドが通る
#   - 固めたバイナリが起動して JSON-RPC に応答する
#   - --worker で自分自身を起動する子プロセス方式が固めた後も機能する
#   - 実際に日本語の文字起こしが返る（macOS の TTS で合成音声を作って使う）

on:
  workflow_dispatch:
  push:
    paths:
      - 'sidecar/**'
      - 'packaging/**'
      - '.github/workflows/build-sidecar-mac.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt
          python -m pip install pyinstaller

      - name: 素の Python で動くことを先に確認
        run: python scripts/sidecar_probe.py

      - name: PyInstaller で固める
        working-directory: packaging
        run: |
          python -m PyInstaller sidecar.spec --noconfirm \
            --distpath ../dist-sidecar --workpath ../build-sidecar

      - name: 成果物の確認
        run: |
          ls -la dist-sidecar/sidecar/sidecar
          file dist-sidecar/sidecar/sidecar
          du -sh dist-sidecar/sidecar
          echo '--- arm64 であること ---'
          file dist-sidecar/sidecar/sidecar | grep -q 'arm64' || (echo "::error::arm64 ではありません"; exit 1)

      - name: 🔴 固めたバイナリで JSON-RPC が通ること
        run: python scripts/sidecar_probe.py dist-sidecar/sidecar/sidecar

      # 実素材は置かない方針なので、macOS の TTS で日本語音声を合成して使う
      - name: 検証用の日本語音声を合成
        run: |
          mkdir -p fixtures-local
          say -v Kyoko -o fixtures-local/speech_ja.aiff \
            "えー、今日はですね、このバイクのカスタムを紹介していきます。まずは、あの、ここのボルトを外していくんですけど、これがめちゃくちゃ固くて全然回らないんですよ。"
          ls -la fixtures-local/

      - name: 🔴 固めたバイナリで文字起こしが返ること
        run: |
          python scripts/sidecar_probe.py dist-sidecar/sidecar/sidecar \
            --transcribe fixtures-local/speech_ja.aiff

      - name: 配布用に固める
        run: |
          cd dist-sidecar
          tar czf ../sidecar-macos-arm64.tar.gz sidecar
          cd ..
          shasum -a 256 sidecar-macos-arm64.tar.gz | tee sidecar-macos-arm64.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sidecar-macos-arm64
          path: |
            sidecar-macos-arm64.tar.gz
            sidecar-macos-arm64.sha256
          if-no-files-found: warn
