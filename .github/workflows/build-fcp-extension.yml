name: build-fcp-extension

# PAC の Final Cut Pro プラグイン(Workflow Extension)をビルドする。
# public リポジトリなので macOS ランナーの課金は 0。
#
# Apple の Workflow Extensions SDK は再配布できないので、ここには置かない。
# private リポジトリ touei0931/pac-fcp-build に置き、
# そのリポジトリ専用の読み取り専用 deploy key (secret: SDK_DEPLOY_KEY) で取得する。

on:
  workflow_dispatch:
  push:
    paths:
      - 'fcp-extension/**'
      - '.github/workflows/build-fcp-extension.yml'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: SDK を private リポジトリから取得
        env:
          DEPLOY_KEY: ${{ secrets.SDK_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::secret SDK_DEPLOY_KEY が未設定です"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --depth 1 git@github.com:touei0931/pac-fcp-build.git sdkrepo
          ls -la sdkrepo/sdk/

      - name: Workflow Extensions SDK を設置
        run: |
          set -euo pipefail
          DMG=$(ls sdkrepo/sdk/*.dmg | head -1)
          echo "▶ $DMG をマウント"
          MP=$(hdiutil attach -nobrowse -readonly "$DMG" | tail -1 | sed 's/^.*\(\/Volumes\/.*\)$/\1/')
          echo "mounted at: $MP"
          echo "--- 中身 ---"
          find "$MP" -maxdepth 3 | head -40

          PKG=$(find "$MP" -maxdepth 2 -name '*.pkg' | head -1 || true)
          if [ -n "$PKG" ]; then
            echo "▶ installer: $PKG"
            sudo installer -pkg "$PKG" -target /
          fi

          if [ ! -d /Library/Developer/SDKs/WorkflowExtensionSDK.sdk ]; then
            SDK=$(find "$MP" -maxdepth 3 -name 'WorkflowExtensionSDK.sdk' | head -1 || true)
            if [ -n "$SDK" ]; then
              echo "▶ copy: $SDK"
              sudo mkdir -p /Library/Developer/SDKs
              sudo cp -R "$SDK" /Library/Developer/SDKs/
            fi
          fi
          hdiutil detach "$MP" || true

          echo "--- 設置結果 ---"
          test -d /Library/Developer/SDKs/WorkflowExtensionSDK.sdk \
            || { echo "::error::SDK の設置に失敗"; exit 1; }
          find /Library/Developer/SDKs/WorkflowExtensionSDK.sdk -maxdepth 4 | head -40

      - name: SDK の API 名を確認（ヘッダ全文は出さない）
        run: |
          set -euo pipefail
          SDK=/Library/Developer/SDKs/WorkflowExtensionSDK.sdk
          echo "=== 宣言されているクラス/プロトコル/メソッド名 ==="
          find "$SDK" -name '*.h' -print0 | while IFS= read -r -d '' h; do
            echo "--- $(basename "$h") ---"
            grep -hE '^\s*(@interface|@protocol|@property|[-+]\s*\()' "$h" | sed 's/  */ /g' || true
          done

      # 🔴 dyld がどの名前で探しに行くかは .tbd の install-name が決める。
      #    ここを見ずに「Final Cut の中にあるはず」で探し先を足したため、
      #    直したつもりで何も変わっていない可能性がある（2026-08-29）。
      #    推測でなく、SDK が何と言っているかを記録に残す。
      - name: ProExtensionHost がどう名乗るか
        run: |
          set -euo pipefail
          SDK=/Library/Developer/SDKs/WorkflowExtensionSDK.sdk
          echo "=== .tbd の中身（install-name / 依存） ==="
          find "$SDK" -name '*.tbd' -print0 | while IFS= read -r -d '' f; do
            echo "--- $f ---"
            grep -E 'install-name|current-version|parent-umbrella|reexport' "$f" || head -20 "$f"
          done
          echo
          echo "=== SDK に入っているもの ==="
          find "$SDK" -maxdepth 6 \( -name 'ProExtension*' -o -name '*.a' \) | head -20

      - name: 鍵を消す
        if: always()
        run: rm -f ~/.ssh/id_ed25519

      - name: 解析エンジンの検査（モデル不要）
        run: python3 fcp-extension/engine/tests/test_engine.py

      - name: xcodegen
        run: brew install xcodegen

      - name: ビルド
        run: ./fcp-extension/scripts/build.sh

      - name: FCPXML の検査
        run: ./fcp-extension/scripts/check_fcpxml.sh

      - name: 解析エンジンと ffmpeg を同梱
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/fcp-extension/build/Build/Products/Release/PAC for Final Cut.app"
          RES="$APP/Contents/Resources"
          mkdir -p dl "$RES/engine" "$RES/ffmpeg"

          # 🔴 エンジンを作り直している最中は待つこと。
          #    build-engine-mac はリリースを**消してから置き直す**。
          #    engine/ を触った push では両方が同時に走るので、
          #    待たずに取りに行くと「release not found」でこけた
          #    （2026-08-27。数秒差で消えている瞬間を踏んだ）。
          echo "▶ エンジンの作り直しが走っていないか確認"
          for _ in $(seq 1 60); do
            RUNNING=$(gh run list --workflow=build-engine-mac --commit="$GITHUB_SHA"                         --status=in_progress --json databaseId --jq 'length' 2>/dev/null || echo 0)
            QUEUED=$(gh run list --workflow=build-engine-mac --commit="$GITHUB_SHA"                        --status=queued --json databaseId --jq 'length' 2>/dev/null || echo 0)
            [ "$RUNNING" = "0" ] && [ "$QUEUED" = "0" ] && break
            echo "  作り直し中… 30秒待つ"
            sleep 30
          done

          echo "▶ 解析エンジン"
          # 置き直しの一瞬を踏んでも諦めない
          for i in 1 2 3 4 5; do
            gh release download pac-engine-mac-arm64 --repo ${{ github.repository }} --dir dl --clobber && break
            echo "  取得に失敗（$i 回目）。20秒待って再試行"
            sleep 20
          done
          ( cd dl && shasum -a 256 -c pac-engine-macos-arm64.sha256 )
          ditto -x -k dl/pac-engine-macos-arm64.zip "$RES/engine"

          echo "▶ ffmpeg（PAC 本体の LGPL ビルド。Homebrew に依存しないもの）"
          gh release download ffmpeg-lgpl-mac-arm64 --repo ${{ github.repository }} --dir dl --clobber
          ( cd dl && shasum -a 256 -c ffmpeg-lgpl-macos-arm64.sha256 )
          tar -xzf dl/ffmpeg-lgpl-macos-arm64.tar.gz -C dl
          FF=$(find dl -type f -name ffmpeg | head -1)
          cp "$FF" "$RES/ffmpeg/ffmpeg"
          chmod +x "$RES/ffmpeg/ffmpeg"

          echo "--- 同梱の結果 ---"
          ls -la "$RES/engine" "$RES/ffmpeg"
          du -sh "$APP"

      - name: アドホック署名
        run: ./fcp-extension/scripts/adhoc-sign.sh "$GITHUB_WORKSPACE/fcp-extension/build/Build/Products/Release/PAC for Final Cut.app"

      - name: 関門チェック
        run: ./fcp-extension/scripts/check_extension.sh "$GITHUB_WORKSPACE/fcp-extension/build/Build/Products/Release/PAC for Final Cut.app"

      - name: 🔴 配布した形で解析が通ること
        run: ./fcp-extension/scripts/check_engine_e2e.sh "$GITHUB_WORKSPACE/fcp-extension/build/Build/Products/Release/PAC for Final Cut.app"

      - name: 🔴 パネルが使う経路（ソケット）で解析が通ること
        run: ./fcp-extension/scripts/check_server_e2e.sh "$GITHUB_WORKSPACE/fcp-extension/build/Build/Products/Release/PAC for Final Cut.app"

      - name: 配布物を固める
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/out"
          PACK="$GITHUB_WORKSPACE/pack/PAC-FCPプラグイン版"
          mkdir -p "$OUT" "$PACK"

          # 友達がそのまま開ける形にまとめる。
          # 🔴 zip でなく ditto を使うこと。実行権限・拡張属性・署名を保つ。
          #    Windows で固め直すと .command の実行権限が落ち、
          #    ダブルクリックしても動かなくなる。
          cp -R "fcp-extension/build/Build/Products/Release/PAC for Final Cut.app" "$PACK/"
          cp "$GITHUB_WORKSPACE/fcp-extension/deliver/インストールと確認.command" "$PACK/"
          # 🔴 うまくいかなかったときの診断も一緒に入れること。
          #    あとから送ると、相手はもう一度ファイルを受け取る所からになる。
          cp "$GITHUB_WORKSPACE/fcp-extension/deliver/パネルが出ないとき.command" "$PACK/"
          cp "$GITHUB_WORKSPACE/fcp-extension/deliver/はじめに読んでね.md" "$PACK/はじめに読んでね.txt"
          chmod +x "$PACK/インストールと確認.command"
          chmod +x "$PACK/パネルが出ないとき.command"

          cd "$GITHUB_WORKSPACE/pack"
          ditto -c -k --sequesterRsrc --keepParent "PAC-FCPプラグイン版" "$OUT/PAC-FCPプラグイン版.zip"

          # 中身の確認用（開発側で見るもの）
          cd "$GITHUB_WORKSPACE/fcp-extension/build/Build/Products/Release"
          ditto -c -k --sequesterRsrc --keepParent "PAC for Final Cut.app" "$OUT/PAC-fcp-test.zip"
          cp "$GITHUB_WORKSPACE"/fcp-extension/deliver/* "$OUT/"

          echo "--- 配布物 ---"
          ls -la "$OUT"
          echo "--- 実行権限の確認 ---"
          unzip -l "$OUT/PAC-FCPプラグイン版.zip" | head -20

      - uses: actions/upload-artifact@v4
        with:
          name: PAC-fcp-test
          path: out/*
