# XcodeGen 定義（Mac が無いので .xcodeproj は手で持たず、CI で毎回生成する）
#   生成: xcodegen generate
#   ビルド: scripts/build.sh
name: PAC
options:
  bundleIdPrefix: com.touei.pac
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    ARCHS: arm64                      # 友達は MacBook Air M2。Intel は切る
    ONLY_ACTIVE_ARCH: NO
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    # 署名は xcodebuild にやらせず、scripts/adhoc-sign.sh でアドホック署名する
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO

targets:
  PAC:
    type: application
    platform: macOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touei.pac.fcp
        # 🔴 デスクトップ版 PAC と同じ名前にしないこと。
        #    どちらも /Applications/PAC.app になり、入れ直すと片方が消える
        #    （インストーラは同名のものを消してから置く）。
        PRODUCT_NAME: PAC for Final Cut
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: WorkflowExtension
        embed: true
        codeSign: false

  WorkflowExtension:
    type: app-extension
    platform: macOS
    sources:
      # webui は下のフォルダ参照で入れるので、ここでは拾わない。
      # 両方から拾うと Resources の直下にも同じ物が並び、二重になる。
      - path: Extension
        excludes:
          - "webui"
          - "webui/**"
      # webui をビルドしたものを Resources/webui として同梱する。
      # 実体は scripts/build.sh が webui/dist からコピーする。
      - path: Extension/webui
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.touei.pac.fcp.WorkflowExtension
        PRODUCT_NAME: WorkflowExtension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WRAPPER_EXTENSION: appex
        MACH_O_TYPE: mh_execute
        COMBINE_HIDPI_IMAGES: YES
        # Workflow Extensions SDK。Apple からダウンロードして
        # /Library/Developer/SDKs/WorkflowExtensionSDK.sdk に置く
        ADDITIONAL_SDKS: /Library/Developer/SDKs/WorkflowExtensionSDK.sdk
        SWIFT_OBJC_BRIDGING_HEADER: Extension/Bridging-Header.h
        OTHER_LDFLAGS:
          - "-fapplication-extension"
          - "-lProExtension"
        FRAMEWORK_SEARCH_PATHS:
          - /Library/Frameworks
          - "$(inherited)"
        LIBRARY_SEARCH_PATHS:
          - /usr/lib
          - "$(inherited)"
        HEADER_SEARCH_PATHS:
          - /usr/include
          - "$(inherited)"
        # 🔴 Final Cut の中も探しに行かせること。
        #
        #    拡張は ProExtensionHost.framework を @rpath で要求する。
        #    その本体は **Final Cut Pro 自身の中**にあり、こちらには入っていない
        #    （Apple の SDK は再配布できないので同梱できない）。
        #    ここを書かないと、どのMacでも起動前に「見つからない」で落ちる。
        #
        #    ビルドは通り、署名も通り、PluginKit にも登録される。
        #    落ちるのは FCP がパネルを開いた瞬間なので、
        #    **CI では一度も起動しないぶん、全部緑のまま出荷される**。
        #    実際に友達の Mac で「読み込み中…」から進まなかった（2026-08-28）。
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
          - "/Applications/Final Cut Pro.app/Contents/Frameworks"
          # SDK を入れている開発機ではこちらで解決する
          - "/Library/Frameworks"

schemes:
  PAC:
    build:
      targets:
        PAC: all
    run:
      config: Debug
    archive:
      config: Release
